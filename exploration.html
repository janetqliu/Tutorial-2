<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>DS4200 Web Dev Tutorial</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="interactivity.js"></script>
    <div id="header" class="header">
        <a href="./index.html" class="container clickable" id="account-container">
            <img src="noun_Hiking_4185384.svg" width="50px">
            <div id="name-container">Your name here!</div>
        </a>
        <div class="container" id="title-container">
            <h2>DS4200 Web Dev Tutorial!</h2>
        </div>
        <div class="container" id="pages-container">
            <a class="pages-btn clickable" href="https://www.google.com">
                Google
            </a>
            <a class="pages-btn clickable" href="https://www.w3schools.com/html/">
                w3schools
            </a>
            <a class="pages-btn clickable" href="./exploration.html">
                Exploration page
            </a>
        </div>
    </div>
    <div class="container body-container">
        <div class="new-container">
            <div class="new-content-title center-content fancy-title">
                <h2>IMG SVG from Altair below!</h2>
            </div>
            <div class="content-body center-content">
                <p>Some generic text we can reference on the page.</p>
                <img src="chart.svg" alt="Altair chart">
            </div>
        </div>

        <div class="new-container">
            <div class="new-content-title center-content fancy-title">
                <h2>D3 exploration for later</h2>
            </div>
            <div class="content-body center-content">
                <p>Some generic text we can reference on the page.</p>
                <div class="content-body center-content">
                    <div id="donut-controls">
                        <label><input type="radio" name="fruit" value="apples" checked> Apples</label>
                        <label><input type="radio" name="fruit" value="oranges"> Oranges</label>
                    </div>
                    <div id="donut-chart"></div>
                </div>

                <script>
                // Observable provides `data` and `width` from other cells, so define them here
                const data = [
                    { apples: 53245, oranges: 200 },
                    { apples: 28479, oranges: 200 },
                    { apples: 19697, oranges: 200 },
                    { apples: 24037, oranges: 200 },
                    { apples: 40245, oranges: 200 }
                ];
                const width = 640;

                // The notebook's `chart = { ... }` block becomes a regular function
                function makeChart() {
                    const height = Math.min(500, width / 2);
                    const outerRadius = height / 2 - 10;
                    const innerRadius = outerRadius * 0.75;
                    const color = d3.scaleOrdinal(d3.schemeObservable10);

                    const svg = d3.create("svg")
                        .attr("viewBox", [-width / 2, -height / 2, width, height])
                        .attr("width", width)
                        .attr("style", "max-width: 100%; height: auto;");

                    const arc = d3.arc()
                        .innerRadius(innerRadius)
                        .outerRadius(outerRadius);

                    const pie = d3.pie().sort(null).value(d => d["apples"]);

                    const path = svg.datum(data).selectAll("path")
                        .data(pie)
                    .join("path")
                        .attr("fill", (d, i) => color(i))
                        .attr("d", arc)
                        .each(function(d) { this._current = d; });

                    function change(value) {
                    pie.value(d => d[value]);
                    path.data(pie);
                    path.transition().duration(750).attrTween("d", arcTween);
                    }

                    function arcTween(a) {
                    const i = d3.interpolate(this._current, a);
                    this._current = i(0);
                    return t => arc(i(t));
                    }

                    return Object.assign(svg.node(), { change });
                }

                // Instead of returning the chart, put it on the page
                const chart = makeChart();
                document.getElementById("donut-chart").append(chart);

                // Replaces the notebook's radio-button cell: call chart.change() when the choice changes
                document.querySelectorAll('input[name="fruit"]').forEach(input => {
                    input.addEventListener("change", e => chart.change(e.target.value));
                });
                </script>
            </div>
        </div>
    </div>

    
    <div id="footer" class="footer">
        <div>
            Tutorial started on October 29, 2026!
        </div>
    </div>
</body>
</html>
